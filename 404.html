<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
// Single-page-app fallback for GitHub Pages. GitHub serves this file for any address that
// isn't a real file -- which, on this site, means every route the JS router handles, like
// /writing/my-post. It re-encodes the attempted address into a query string and sends the
// browser to index.html, which restores the real-looking address with history.replaceState
// before anything else runs (see the inline script at the top of index.html's <head>).
// Technique: https://github.com/rafgraph/spa-github-pages
//
// Set this to the number of address segments that belong to the site itself, not the route.
// A GitHub Pages PROJECT site (https://you.github.io/reponame/writing/my-post) is reached
// through one extra segment ("reponame"), so this should stay 1. A custom domain or a
// user/organization site (https://you.github.io/writing/my-post) serves from the root --
// set it to 0 in that case.
var pathSegmentsToKeep = 1;

var l = window.location;
var keep = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
l.replace(
  l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
  keep + "/?p=" + encodeURIComponent(l.pathname.slice(keep.length)) +
  (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
  l.hash
);
</script>
</head>
<body></body>
</html>
